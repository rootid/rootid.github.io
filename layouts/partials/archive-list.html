{{/* Archive list shared by the home page and section list pages.
     Expects a dict with "title" and "pages". */}}
<div class="archives-container">
  <h2>{{ .title }}</h2>
  <p class="post-count-text">
    There are <span class="post-count">{{ len .pages }}</span> articles.
  </p>
  
  <ul class="archive-list">
    {{ range .pages }}
      <li>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
</div>
